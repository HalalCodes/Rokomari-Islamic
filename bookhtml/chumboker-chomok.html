  <script>
    const rawMarkdown = "# 🧲 চুম্বকের চমক — খেলতে খেলতে বিজ্ঞান শেখার দারুণ সুযোগ! 🔬✨\n\nআপনার সন্তান কি বিজ্ঞান নিয়ে কৌতূহলী?\nবইয়ের শুধু থিওরি মুখস্থ না করে **নিজের হাতে এক্সপেরিমেন্ট করে বিজ্ঞান শিখুক**—এমন কিছু খুঁজছেন?\n\nতাহলে **চুম্বকের চমক (Magic of Magnet)** হতে পারে দারুণ একটি শিক্ষামূলক সায়েন্স কিট। 🧲\n\n## 🎯 কেন আপনার সন্তানের জন্য চুম্বকের চমক?\n\n**চুম্বক কীভাবে কাজ করে?**\n**কোন বস্তু চুম্বকে আকৃষ্ট হয়?**\n**চুম্বকের আকর্ষণ ও বিকর্ষণ কীভাবে কাজ করে?**\n\nএ ধরনের বিষয় শুধু বই পড়ে বোঝার বদলে হাতে-কলমে পরীক্ষা করে শেখার সুযোগ তৈরি করে এই কিট।\n\n### 🔬 এতে যা থাকছে\n\n✅ **২৬টি চুম্বকভিত্তিক সায়েন্স এক্সপেরিমেন্ট**\n✅ হাতে-কলমে বিজ্ঞান শেখার সুযোগ\n✅ চুম্বক বিষয়ক বিভিন্ন ধারণা পরীক্ষার মাধ্যমে বোঝার ব্যবস্থা\n✅ শিশুদের কৌতূহল ও অনুসন্ধানী মানসিকতা বাড়াতে সহায়ক\n✅ খেলতে খেলতে বিজ্ঞান শেখার আনন্দ\n✅ স্কুলের বিজ্ঞানের ধারণাকে বাস্তব অভিজ্ঞতার সঙ্গে মিলিয়ে দেখার সুযোগ\n\nOnnoRokom BigganBaksho-এর তথ্য অনুযায়ী, বিজ্ঞানবাক্সের লক্ষ্য হলো শিশুদের হাতে-কলমে এক্সপেরিমেন্টের মাধ্যমে বিজ্ঞান শেখানো এবং পাঠ্যবইয়ের কঠিন থিওরিকে আরও আনন্দদায়কভাবে বোঝার সুযোগ তৈরি করা।\n\n## 👨‍👩‍👧 বাবা-মায়ের জন্য কেন এটি ভালো একটি পছন্দ?\n\nআজকাল শিশুদের অবসর সময়ের বড় একটি অংশ স্ক্রিনে চলে যায়। সেই সময়টাকে যদি **খেলা + পরীক্ষা + শেখার অভিজ্ঞতায়** পরিণত করা যায়, তাহলে শেখাটা আরও আনন্দদায়ক হতে পারে।\n\n**চুম্বকের চমক** এমন একটি সায়েন্স কিট, যেখানে সন্তান শুধু দেখবে না—নিজে পরীক্ষা করে দেখবে, প্রশ্ন করবে এবং ফলাফল থেকে শেখার সুযোগ পাবে। 🧠🔍\n\n🎓 **বয়স:** ৭–১৬ বছর\n🧲 **বিষয়:** চুম্বক\n🔬 **এক্সপেরিমেন্ট:** ২৬টি\n🏷️ **ব্র্যান্ড:** OnnoRokom BigganBaksho\n💰 **বর্তমান অনলাইন মূল্য:** ৳৯৯০\n\n## 🎁 সন্তানের জন্য উপহার হিসেবেও দারুণ!\n\nজন্মদিন, পরীক্ষার পর কিংবা বিশেষ কোনো উপলক্ষে সাধারণ খেলনার বদলে এমন একটি **শিক্ষামূলক সায়েন্স কিট** দিতে পারেন, যা আনন্দের পাশাপাশি বিজ্ঞান সম্পর্কে আগ্রহ তৈরি করতে সাহায্য করবে।\n\n### 🚀 আপনার সন্তানকে শুধু বিজ্ঞান পড়াবেন না—বিজ্ঞানকে হাতে-কলমে আবিষ্কার করতে দিন!\n\n👉 অর্ডার করতে (এখনই অর্ডার করুন) বাটনে ক্লিক করুন \n\n#চুম্বকেরচমক #চুম্বকের_চমক #বিজ্ঞানবাক্স #OnnoRokomBigganBaksho #ScienceKit #MagnetExperiment #বাচ্চাদের_সায়েন্স_কিট #শিশুদের_শিক্ষামূলক_খেলনা #EducationalToy #STEMLearning #বিজ্ঞান_শিক্ষা #হাতে_কলমে_বিজ্ঞান #বাচ্চাদের_উপহার";
    const showToast = (msg) => {
      const toast = document.getElementById('toast');
      document.getElementById('toast-msg').innerText = msg;
      toast.classList.remove('translate-y-10', 'opacity-0');
      setTimeout(() => toast.classList.add('translate-y-10', 'opacity-0'), 2500);
    };

    const renderer = new marked.Renderer();
    renderer.link = function(href, title, text) {
      return `<a href="${href}" target="_blank" rel="noopener noreferrer" class="text-emerald-600 dark:text-emerald-400 font-bold underline hover:text-emerald-700">${text}</a>`;
    };
    marked.setOptions({ renderer: renderer, breaks: true, gfm: true });
    document.getElementById('detail-desc').innerHTML = DOMPurify.sanitize(marked.parse(rawMarkdown));

    const copyBtn = document.getElementById('copy-coupon-btn');
    if(copyBtn) {
      copyBtn.onclick = () => {
        navigator.clipboard.writeText('');
        showToast("কুপন কোড কপি হয়েছে!");
      };
    }

    document.getElementById('detail-share-btn').onclick = () => {
      const shareUrl = 'https://affiliate-rokomari-islamic.vercel.app/bookhtml/chumboker-chomok.html';
      if (navigator.share) {
        navigator.share({ title: '🧲 চুম্বকের চমক — খেলতে খেলতে বিজ্ঞান শেখার দারুণ সুযোগ! 🔬✨', text: 'এই ইসলামিক বইটি চেক করুন!', url: shareUrl }).catch(e=>console.log(e));
      } else {
        navigator.clipboard.writeText(shareUrl);
        showToast("লিংক কপি হয়েছে!");
      }
    };
  </script>
