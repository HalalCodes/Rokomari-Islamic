    const rawMarkdown = "🗣️ **কথা বলার কৌশল — সঠিক সময়ে, সঠিক মানুষের সঙ্গে, সঠিকভাবে কথা বলার পাঠ!**\n\nকথা বলা আমরা সবাই জানি।\nকিন্তু **কখন কী বলতে হবে, কীভাবে বলতে হবে, কার সঙ্গে কীভাবে কথা বলতে হবে—সেটা কি আমরা সবাই জানি?**\n\nঅনেক সময় কথার বিষয় ঠিক থাকে, কিন্তু বলার ধরন ঠিক না থাকায় তৈরি হয় ভুল বোঝাবুঝি। কখনো একটি ভুল শব্দ নষ্ট করে দিতে পারে সম্পর্ক, আবার সঠিক সময়ে বলা কয়েকটি কথা খুলে দিতে পারে নতুন সম্ভাবনার দরজা।\n\n📚 **‘কথা বলার কৌশল’** বইটি সেই যোগাযোগের দক্ষতাকে আরও সচেতনভাবে গড়ে তোলার জন্য একটি কার্যকর পাঠ।\n\nবইটির মূল ভাবনা খুব সহজ—\n**যে কারো সঙ্গে, যেকোনো সময়ে, যেকোনো পরিস্থিতিতে কীভাবে আরও সুন্দর ও কার্যকরভাবে কথা বলা যায়।**\n\n✨ **কেন পড়বেন ‘কথা বলার কৌশল’?**\n\n🔹 **কথা বলার ধরন উন্নত করতে** — শুধু কী বলবেন নয়, কীভাবে বলবেন—সেটার গুরুত্ব বুঝতে সাহায্য করবে।\n\n🔹 **ভুল বোঝাবুঝি কমাতে** — কথার মাধ্যমে অনাকাঙ্ক্ষিত সমস্যা তৈরি না করে আরও পরিষ্কারভাবে নিজের বক্তব্য প্রকাশ করার বিষয়ে ধারণা দেবে।\n\n🔹 **সম্পর্কে ইতিবাচক প্রভাব ফেলতে** — পরিবার, বন্ধু, সহপাঠী কিংবা পরিচিতদের সঙ্গে যোগাযোগ আরও সুন্দর করার সুযোগ তৈরি করবে।\n\n🔹 **আত্মবিশ্বাসের সঙ্গে কথা বলতে** — নিজের কথা গুছিয়ে ও পরিস্থিতি বুঝে প্রকাশ করার দক্ষতা বাড়াতে সহায়ক হতে পারে।\n\n🔹 **বিভিন্ন পরিস্থিতিতে নিজেকে মানিয়ে নিতে** — সব মানুষের সঙ্গে একইভাবে কথা বলা যায় না। ব্যক্তি ও পরিস্থিতি বুঝে যোগাযোগ করার বিষয়টি বইটি ভাবতে শেখায়।\n\n🌱 **মনে রাখবেন—ভালো যোগাযোগ শুধু বেশি কথা বলার নাম নয়; বরং সঠিক সময়ে সঠিক কথাটি সঠিকভাবে বলতে পারাটাই আসল দক্ষতা।**\n\n📖 **‘কথা বলার কৌশল’** বইটি হতে পারে আপনার যোগাযোগ দক্ষতা আরও ভালোভাবে গড়ে তোলার একটি সুন্দর শুরু।\n\n👉 **বইটি অর্ডার করতে এখনই ক্লিক করুন:**\n🔗 [https://rkmri.co/lNSEpRepSeeR/]\n\n🎁 **নিজের জন্য পড়ুন, আর এমন কাউকে উপহার দিন—যার যোগাযোগ দক্ষতা আরও একটু ভালো হলে তার পথচলাটা আরও সহজ হতে পারে।**\n\n⚡ **কথা বলার ধরন বদলান, যোগাযোগের মান বদলান।**";

    const copyBtn = document.getElementById('copy-coupon-btn');

      const shareUrl = 'https://affiliate-rokomari-islamic.vercel.app/bookhtml/khotha-bolar-kowshol.html';

        navigator.share({ title: '🗣️ **কথা বলার কৌশল — সঠিক সময়ে, সঠিক মানুষের সঙ্গে, সঠিকভাবে কথা বলার পাঠ!**', text: 'এই ইসলামিক বইটি চেক করুন!', url: shareUrl }).catch(e=>console.log(e));
      } else {
        navigator.clipboard.writeText(shareUrl);
        showToast("লিংক কপি হয়েছে!");
      }
    };
