  <script>
    const rawMarkdown = "# 📚 ইসলামি ইতিহাস (১ম–৫ম খণ্ড) — ইতিহাস জানুন, অতীত থেকে শিক্ষা নিন\n\n**ইসলামের ইতিহাস শুধু অতীতের গল্প নয়—এটি আমাদের সভ্যতা, সংস্কৃতি, উত্থান-পতন ও শিক্ষা বোঝার একটি গুরুত্বপূর্ণ মাধ্যম।**\n\nযারা **ইসলামের ইতিহাস**, মুসলিম সভ্যতার বিকাশ এবং মুসলিম শাসনামলের গুরুত্বপূর্ণ ঘটনাগুলো ধারাবাহিকভাবে জানতে চান, তাদের জন্য **“ইসলামি ইতিহাস (১ম–৫ম খণ্ড)”** হতে পারে একটি সমৃদ্ধ সংগ্রহ। 📖\n\n## 🌙 এই সিরিজে কী জানতে পারবেন?\n\n📌 ইসলামপূর্ব আরবের ইতিহাস\n📌 রাসূলুল্লাহ ﷺ-এর যুগ ও ইসলামের প্রাথমিক ইতিহাস\n📌 খোলাফায়ে রাশিদিনের সময়কাল\n📌 উমাইয়া ও আব্বাসি খিলাফতের ইতিহাস\n📌 মুসলিম বিশ্বের বিভিন্ন রাজবংশ ও সাম্রাজ্য\n📌 তাতার ও মুসলিম বিশ্বের গুরুত্বপূর্ণ অধ্যায়\n📌 উসমানি সাম্রাজ্যের ইতিহাস\n📌 মুসলিম সভ্যতা ও ঐতিহ্যের নানা দিক\n📌 অতীতের সফলতা ও ব্যর্থতা থেকে শিক্ষার সুযোগ\n\n## 🤔 কেন এই ৫ খণ্ডের সিরিজটি সংগ্রহ করবেন?\n\nএকটি-দুটি বিচ্ছিন্ন ঘটনা জানার বদলে **ইসলামী ইতিহাসকে ধারাবাহিকভাবে পড়ার** সুযোগ পাবেন।\n\nইতিহাস পড়লে আমরা জানতে পারি—\n\n🧠 অতীতে কী ঘটেছিল\n📖 কেন ঘটেছিল\n🔎 কোন সিদ্ধান্তের কী পরিণতি হয়েছিল\n🌍 মুসলিম সভ্যতা কীভাবে বিকশিত হয়েছিল\n💡 অতীতের ঘটনাগুলো থেকে বর্তমানের জন্য কী শিক্ষা নেওয়া যায়\n\nবিশেষ করে যারা **ইসলামি ইতিহাস ও ঐতিহ্য**, মুসলিম সভ্যতা এবং বিশ্ব ইতিহাস নিয়ে পড়তে আগ্রহী, তাদের ব্যক্তিগত লাইব্রেরিতে এমন একটি সিরিজ মূল্যবান সংযোজন হতে পারে।\n\n## 📚 বইয়ের তথ্য\n\n**বই:** ইসলামি ইতিহাস (১ম–৫ম খণ্ড)\n**মূল লেখক:** ড. রাগিব সারজানি\n**অনুবাদকবৃন্দ:** মাহদি হাসান, মাওলানা আতাউল কারীম মাকসুদ, আবু তালহা সাজিদসহ অন্যান্য অনুবাদক\n**প্রকাশনী:** মাকতাবাতুল হাসান\n**মোট পৃষ্ঠা:** প্রায় ১,৬৯৬\n**ভাষা:** বাংলা\n**খণ্ড:** ৫টি\n\n### 🎁 কারা সংগ্রহ করতে পারেন?\n\n✅ ইসলামি ইতিহাসে আগ্রহী পাঠক\n✅ মুসলিম সভ্যতা ও ঐতিহ্য সম্পর্কে জানতে আগ্রহী ব্যক্তি\n✅ শিক্ষার্থী ও ইতিহাসপ্রেমী\n✅ যারা নিজের ব্যক্তিগত ইসলামি লাইব্রেরি সমৃদ্ধ করতে চান\n✅ যারা ধারাবাহিকভাবে ইসলামের ইতিহাস পড়তে চান\n\n---\n\n### 🛒 ইতিহাস জানার এই যাত্রা শুরু করুন আজই!\n\n📖 **৫ খণ্ডের ইসলামি ইতিহাস সিরিজটি সংগ্রহ করতে নিচের বাটনে ক্লিক করুন।**\n\n👉 🛒 অর্ডার করতে ( এখনই অর্ডার করুন ) বাটনে ক্লিক করুন \n\n**ইতিহাস জানুন • অতীত থেকে শিক্ষা নিন • জ্ঞানকে সমৃদ্ধ করুন**\n\n#ইসলামি_ইতিহাস #ইসলামের_ইতিহাস #IslamicHistory #ইসলামী_ইতিহাস #মুসলিম_ইতিহাস #মুসলিম_সভ্যতা #ইসলামি_বই #ইসলামিক_বই #ইসলামি_ইতিহাসের_বই #ইতিহাসের_বই #ইসলামী_লাইব্রেরি #IslamicBooks #BanglaIslamicBooks #ইসলামি_ঐতিহ্য";
    const showToast = (msg) => {
      const toast = document.getElementById('toast');
      document.getElementById('toast-msg').innerText = msg;
      toast.classList.remove('translate-y-10', 'opacity-0');
      setTimeout(() => toast.classList.add('translate-y-10', 'opacity-0'), 2500);
    };

    const renderer = new marked.Renderer();
    renderer.link = function(href, title, text) {
      return `<a href="${href}" target="_blank" rel="noopener noreferrer" class="text-emerald-600 dark:text-emerald-400 font-bold underline hover:text-emerald-700">${text}</a>`;
    };
    marked.setOptions({ renderer: renderer, breaks: true, gfm: true });
    document.getElementById('detail-desc').innerHTML = DOMPurify.sanitize(marked.parse(rawMarkdown));

    const copyBtn = document.getElementById('copy-coupon-btn');
    if(copyBtn) {
      copyBtn.onclick = () => {
        navigator.clipboard.writeText('');
        showToast("কুপন কোড কপি হয়েছে!");
      };
    }

    document.getElementById('detail-share-btn').onclick = () => {
      const shareUrl = 'https://affiliate-rokomari-islamic.vercel.app/bookhtml/islamer-etihash-1-5.html';
      if (navigator.share) {
        navigator.share({ title: 'ইসলামি ইতিহাস (১ম–৫ম খণ্ড) — ইতিহাস জানুন, অতীত থেকে শিক্ষা নিন', text: 'এই ইসলামিক বইটি চেক করুন!', url: shareUrl }).catch(e=>console.log(e));
      } else {
        navigator.clipboard.writeText(shareUrl);
        showToast("লিংক কপি হয়েছে!");
      }
    };
