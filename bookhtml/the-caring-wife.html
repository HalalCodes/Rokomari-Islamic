  <script>
    const rawMarkdown = "# 🌿 দ্য কেয়ারিং ওয়াইফ\n\n### *সুখী পরিবার গঠনে স্ত্রীর ভূমিকা*\n\nএকটি সুন্দর পরিবার শুধু ভালোবাসায় নয়—পারস্পরিক বোঝাপড়া, দায়িত্ববোধ, যত্ন ও সুন্দর আচরণের মাধ্যমেই গড়ে ওঠে।\n\n**দ্য কেয়ারিং ওয়াইফ** বইটি স্ত্রী হিসেবে নিজের ভূমিকা, দাম্পত্য সম্পর্ককে আরও সুন্দর করে তোলা এবং একটি শান্তিপূর্ণ ও সুখী পরিবার গড়ে তোলার বিষয়ে ভাবতে সাহায্য করবে।\n\n📖 **বইটির বিশেষত্ব:**\n\n* দাম্পত্য জীবনে পারস্পরিক বোঝাপড়া বাড়াতে সহায়ক\n* পরিবারকে আরও সুন্দরভাবে গড়ে তোলার বিষয়ে দিকনির্দেশনা\n* স্ত্রী হিসেবে দায়িত্ব ও ভূমিকা সম্পর্কে সচেতন হতে সহায়তা\n* স্বামী-স্ত্রীর সম্পর্ককে আরও যত্নশীল ও সুন্দর করার ভাবনা\n* পরিবার ও দাম্পত্য জীবন নিয়ে গুরুত্বপূর্ণ বিষয়গুলো সহজভাবে উপস্থাপন\n\n**বিয়ে করেছেন?**\n**বিয়ে করতে যাচ্ছেন?**\n**নিজের পরিবারকে আরও সুন্দর ও সুখী করে তুলতে চান?**\n\nতাহলে বইটি আপনার জন্য উপকারী একটি পাঠ হতে পারে। 🌸\n\n📚 **বই:** দ্য কেয়ারিং ওয়াইফ\n✍️ **লেখক:** মোঃ মতিউর রহমান\n🏢 **প্রকাশনী:** মিফতাহ প্রকাশনী\n📄 **পৃষ্ঠা:** ১৭৬\n📕 **কভার:** হার্ডকভার\n\n### 🛒  অর্ডার করতে এখনই অর্ডার করুন বাটনে ক্লিক করুন \n\n*আজকের একটি ভালো বই হতে পারে আগামী দিনের সুন্দর পরিবারের অনুপ্রেরণা।* 🌿";
    const showToast = (msg) => {
      const toast = document.getElementById('toast');
      document.getElementById('toast-msg').innerText = msg;
      toast.classList.remove('translate-y-10', 'opacity-0');
      setTimeout(() => toast.classList.add('translate-y-10', 'opacity-0'), 2500);
    };

    const renderer = new marked.Renderer();
    renderer.link = function(href, title, text) {
      return `<a href="${href}" target="_blank" rel="noopener noreferrer" class="text-emerald-600 dark:text-emerald-400 font-bold underline hover:text-emerald-700">${text}</a>`;
    };
    marked.setOptions({ renderer: renderer, breaks: true, gfm: true });
    document.getElementById('detail-desc').innerHTML = DOMPurify.sanitize(marked.parse(rawMarkdown));

    const copyBtn = document.getElementById('copy-coupon-btn');
    if(copyBtn) {
      copyBtn.onclick = () => {
        navigator.clipboard.writeText('CHAMPION26');
        showToast("কুপন কোড কপি হয়েছে!");
      };
    }

    document.getElementById('detail-share-btn').onclick = () => {
      const shareUrl = 'https://affiliate-rokomari-islamic.vercel.app/bookhtml/the-caring-wife.html';
      if (navigator.share) {
        navigator.share({ title: '🌿 দ্য কেয়ারিং ওয়াইফ', text: 'এই ইসলামিক বইটি চেক করুন!', url: shareUrl }).catch(e=>console.log(e));
      } else {
        navigator.clipboard.writeText(shareUrl);
        showToast("লিংক কপি হয়েছে!");
      }
    };
