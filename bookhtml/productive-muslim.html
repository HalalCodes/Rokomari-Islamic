    const rawMarkdown = "🔥 জীবনের প্রতিটি ক্ষেত্রে প্রোডাক্টিভিটি ও সাফল্য অর্জনের সেরা গাইডবুক — \"প্রোডাক্টিভ মুসলিম\"!\n\n👉 এখনই বিশেষ ছাড়ে বইটি অর্ডার করতে নিচে দেওয়া লিঙ্কে ক্লিক করুন:\n🔗 Https://rkmri.co/E5p5NTEASSyA/\n\n---\n\n📚 **বইয়ের সংক্ষিপ্ত পরিচয় (Summary):**\nমোহাম্মদ ফারিস রচিত আন্তর্জাতিক সমাদৃত বই 'দ্য প্রোডাক্টিভ মুসলিম'-এর প্রাঞ্জল অনুবাদ 'প্রোডাক্টিভ মুসলিম'। বইটি আধুনিক প্রোডাক্টিভিটি টেকনিক এবং ইসলামি জীবনদর্শনের এক অসাধারণ সংমিশ্রণ। এতে লেখক দৈনন্দিন কাজের ব্যস্ততার মাঝেও কীভাবে আত্মিক, শারীরিক ও মানসিক শক্তির সঠিক ব্যবহার করে দ্বীন ও দুনিয়া—উভয় ক্ষেত্রেই সর্বোচ্চ সাফল্য অর্জন করা যায়, তা বাস্তবসম্মত উদাহরণসহ উপস্থাপন করেছেন।\n\n✨ **কেন এই বইটি আপনার পড়া জরুরি?**\n* **দ্বীন ও দুনিয়ার ভারসাম্য:** কাজের ব্যস্ততায় ইবাদতে ঘাটতি কিংবা ইবাদতের পাশাপাশি ক্যারিয়ার ও পড়াশোনায় পিছিয়ে পড়ার সমস্যার স্থায়ী সমাধান।\n* **সময় ও শক্তি ব্যবস্থাপনা:** কীভাবে অলসতা ও সময় অপচয় দূর করে প্রতিদিনের কাজের সর্বোচ্চ আউটপুট বের করা যায়।\n* **অভ্যাস পরিবর্তন:** প্রোডাক্টিভ ও পজিটিভ মানসিকতা গড়ে তোলার কার্যকরী স্ট্র্যাটেজি।\n* **বাস্তবসম্মত গাইডলাইন:** দৈনিক রুটিন সাজানো থেকে শুরু করে লক্ষ্য অর্জনের সুস্পষ্ট ধাপসমূহ।\n\n---\n\n🎁 **বিশেষ ছাড়ের ধামাকা অফার!**\nবইটি রকমারি থেকে অর্ডার করার সময় পান এক্সক্লুসিভ ডিসকাউন্ট! \n\nচেকআউট পেজে ব্যবহার করুন স্পেশাল কুপন কোড: **CHAMPION26**\n(কুপন কোডটি ব্যবহার করলে আপনি পাবেন অতিরিক্ত বিশেষ মূল্যছাড়!)\n\n---\n\n⚡ **আজই আপনার জীবনের প্রোডাক্টিভিটি জার্নি শুরু করুন!**\nঅর্ডার করতে এখনই ভিজিট করুন:\n👉 Https://rkmri.co/E5p5NTEASSyA/";

      setTimeout(() => toast.classList.add('translate-y-10', 'opacity-0'), 2500);
    };

    const renderer = new marked.Renderer();
    renderer.link = function(href, title, text) {
      return `<a href="${href}" target="_blank" rel="noopener noreferrer" class="text-emerald-600 dark:text-emerald-400 font-bold underline hover:text-emerald-700">${text}</a>`;
    };
    marked.setOptions({ renderer: renderer, breaks: true, gfm: true });
    document.getElementById('detail-desc').innerHTML = DOMPurify.sanitize(marked.parse(rawMarkdown));

      } else {
        navigator.clipboard.writeText(shareUrl);
        showToast("লিংক কপি হয়েছে!");
