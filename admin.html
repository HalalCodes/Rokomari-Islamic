<!DOCTYPE html>
<html lang="bn" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Admin Dashboard - Rokomari Islamic</title>
  <meta name="robots" content="noindex, nofollow">

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Hind Siliguri', 'sans-serif'] },
          colors: { islamic: { 800: '#166534', 900: '#14532d' } }
        }
      }
    }
  </script>
  <style> 
    body { font-family: 'Hind Siliguri', sans-serif; background-color: #f1f5f9; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  </style>
</head>
<body class="min-h-screen text-slate-800 flex flex-col justify-between overflow-x-hidden">

  <!-- Admin Password Screen -->
  <div id="auth-screen" class="fixed inset-0 bg-slate-900 z-50 flex items-center justify-center p-4 transition-opacity duration-300">
    <div class="bg-white rounded-2xl shadow-2xl p-8 max-w-sm w-full text-center border border-slate-100">
      <div class="w-16 h-16 bg-emerald-50 text-emerald-700 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl shadow-inner border border-emerald-100">
        <i class="fa-solid fa-shield-halved"></i>
      </div>
      <h2 class="text-2xl font-bold text-slate-800 mb-1">কন্ট্রোল প্যানেল</h2>
      <p class="text-sm text-slate-500 mb-6">প্রবেশ করতে পাসওয়ার্ড দিন</p>

      <form id="auth-form" class="space-y-4">
        <input type="password" id="admin-pass-input" required placeholder="••••••••" class="w-full px-4 py-3 rounded-xl border border-slate-300 text-sm text-center outline-none focus:ring-2 focus:ring-emerald-600 bg-slate-50" autocomplete="current-password">
        <button type="submit" class="w-full bg-islamic-800 hover:bg-islamic-900 text-white font-bold py-3 rounded-xl text-sm transition-all shadow-md">
          <i class="fa-solid fa-arrow-right-to-bracket"></i> লগইন করুন
        </button>
      </form>
    </div>
  </div>

  <!-- Dashboard Container -->
  <div id="dashboard" class="hidden flex-1 flex flex-col h-screen overflow-hidden">
    
    <header class="bg-islamic-900 text-white shadow-md py-3 px-4 shrink-0 border-b border-islamic-800 z-40 relative">
      <div class="max-w-7xl mx-auto flex justify-between items-center">
        <div class="flex items-center gap-3">
          <div class="bg-white p-1 rounded-lg">
            <img src="https://onlinecdndrive.vercel.app/rokomari-islamic-logo.jpg" alt="Logo" class="w-8 h-8 rounded object-cover" onerror="this.style.display='none'; this.nextElementSibling.classList.remove('hidden');">
            <span class="hidden text-slate-900 font-bold text-sm">📖</span>
          </div>
          <h1 class="text-sm md:text-lg font-bold text-amber-300 hidden sm:block">অ্যাডমিন প্যানেল</h1>
        </div>
        <div class="flex items-center gap-2 md:gap-3">
          <span id="sync-status" class="hidden text-[10px] bg-emerald-800 px-2 py-1 rounded-full text-emerald-100 font-bold border border-emerald-600">
            <i class="fa-solid fa-check-circle"></i> Synced
          </span>
          <button id="open-github-settings" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-white px-3 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1.5 transition">
            <i class="fa-solid fa-code-branch text-amber-400"></i> গিটহাব সেটিংস
          </button>
          <button id="btn-backup" onclick="downloadJSONBackup()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1.5">
            <i class="fa-solid fa-download"></i> ব্যাকআপ
          </button>
          <a href="index.html" target="_blank" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1.5 transition">
            <i class="fa-solid fa-arrow-up-right-from-square"></i> ওয়েবসাইট
          </a>
        </div>
      </div>
    </header>

    <div class="flex-1 overflow-y-auto bg-slate-50">
      <main class="max-w-7xl mx-auto px-4 py-6 grid grid-cols-1 lg:grid-cols-12 gap-6">

        <!-- Form Column -->
        <section class="lg:col-span-5 h-fit bg-white rounded-2xl shadow-sm border border-slate-200 p-5 md:p-6 sticky top-6">
          <div class="flex justify-between items-center border-b border-slate-100 pb-3 mb-5">
            <h2 id="form-title" class="text-lg font-bold text-slate-800 flex items-center gap-2">
              <i class="fa-solid fa-pen-to-square text-emerald-600"></i> বই যুক্ত / এডিট করুন
            </h2>
            <button id="reset-form-btn" class="hidden text-xs bg-red-50 text-red-600 border border-red-200 px-2 py-1 rounded font-bold hover:bg-red-100 transition">
              বাতিল করুন
            </button>
          </div>

          <form id="book-form" class="space-y-4">
            <input type="hidden" id="edit-book-id">
            <input type="hidden" id="old-html-file">

            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1.5">বইয়ের শিরোনাম <span class="text-red-500">*</span></label>
              <input type="text" id="book-title" required placeholder="যেমন: প্রোডাক্টিভ মুসলিম" class="w-full border border-slate-300 rounded-xl p-2.5 text-sm outline-none focus:ring-2 focus:ring-emerald-500 bg-slate-50 focus:bg-white">
            </div>

            <!-- Book HTML Filename Field -->
            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1">Book HTML File Name <span class="text-red-500">*</span></label>
              <input type="text" id="book-html-file" required placeholder="যেমন: productive-muslim.html" class="w-full border border-slate-300 rounded-xl p-2.5 text-sm outline-none focus:ring-2 focus:ring-emerald-500 bg-slate-50 font-mono">
              <p class="text-[10px] text-slate-500 mt-1">💡 ফাইলটি <span class="font-mono text-emerald-700 font-bold">bookhtml/</span> ফোল্ডারে সেভ হবে। (যেমন: productive-muslim.html)</p>
            </div>

            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1.5">Category (ক্যাটাগরি)</label>
              <input type="text" id="book-category" placeholder="যেমন: কুরআন, আকিদাহ, পরিবার..." class="w-full border border-slate-300 rounded-xl p-2.5 text-sm outline-none focus:ring-2 focus:ring-emerald-500 bg-slate-50">
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div>
                <label class="block text-xs font-bold text-slate-700 mb-1.5">অ্যাফিলিয়েট লিংক <span class="text-red-500">*</span></label>
                <input type="url" id="affiliate-link" required placeholder="https://rkmri.co/..." class="w-full border border-slate-300 rounded-xl p-2.5 text-sm outline-none focus:ring-2 focus:ring-emerald-500 bg-slate-50">
              </div>
              <div>
                <label class="block text-xs font-bold text-slate-700 mb-1.5">কুপন কোড</label>
                <input type="text" id="coupon-code" placeholder="ঐচ্ছিক (যেমন: CHAMPION26)" class="w-full border border-slate-300 rounded-xl p-2.5 text-sm outline-none focus:ring-2 focus:ring-emerald-500 bg-slate-50">
              </div>
            </div>

            <!-- IMAGE UPLOAD TO image/ FOLDER -->
            <div class="bg-slate-50 border border-slate-200 rounded-xl p-4 space-y-3">
              <label class="block text-xs font-bold text-slate-800 flex items-center gap-2 border-b border-slate-200 pb-2 mb-2">
                <i class="fa-regular fa-image text-emerald-600 text-sm"></i> ইমেজ আপলোড (image/ ফোল্ডার)
              </label>

              <div>
                <label class="block text-[10px] font-bold text-slate-500 mb-1">Image URL</label>
                <input type="url" id="image-url-input" required placeholder="https://affiliate-rokomari-islamic.vercel.app/image/..." class="w-full border border-slate-300 rounded-lg p-2.5 text-xs outline-none focus:ring-2 focus:ring-emerald-500 bg-white">
              </div>
              
              <div class="mt-3 pt-3 border-t border-slate-200 space-y-2">
                 <p class="text-[11px] font-bold text-slate-700">গিটহাবে নতুন ছবি আপলোড করুন:</p>
                 <input type="file" id="file-input" accept=".jpg,.jpeg,.png,.webp" class="w-full text-xs text-slate-500 file:mr-4 file:py-1.5 file:px-3 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-emerald-50 file:text-emerald-700 border border-slate-200 rounded-xl p-1 bg-white">
                 <input type="text" id="custom-file-name" placeholder="ফাইলের নাম (যেমন: picture.jpg)" class="w-full border border-slate-300 rounded-lg p-2 text-xs outline-none focus:border-emerald-500 font-mono">
                 <button type="button" id="btn-direct-upload" class="w-full bg-slate-800 hover:bg-slate-900 text-white text-xs font-bold py-2.5 rounded-lg transition flex items-center justify-center gap-2 shadow-sm">
                   <i class="fa-solid fa-upload"></i> image/ ফোল্ডারে আপলোড করুন
                 </button>
                 <div id="upload-result" class="hidden p-2.5 bg-emerald-50 border border-emerald-200 rounded-lg text-[11px] text-emerald-800 break-all leading-relaxed">
                    <i class="fa-solid fa-check-circle"></i> সফলভাবে আপলোড হয়েছে:<br>
                    <a id="uploaded-url-text" href="#" target="_blank" class="font-mono font-bold text-emerald-700 hover:underline"></a>
                 </div>
              </div>
            </div>

            <div class="flex items-center gap-2">
              <input type="checkbox" id="book-featured" class="w-4 h-4 text-emerald-600 rounded border-slate-300 focus:ring-emerald-500">
              <label for="book-featured" class="text-xs font-bold text-slate-700 cursor-pointer">Featured (হোমপেজে হাইলাইট করুন)</label>
            </div>

            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1.5">বিবরণ (Markdown Supported) <span class="text-red-500">*</span></label>
              <textarea id="book-desc" rows="5" required placeholder="বইয়ের বিস্তারিত তথ্য..." class="w-full border border-slate-300 rounded-xl p-3 text-sm outline-none focus:ring-2 focus:ring-emerald-500 bg-slate-50 focus:bg-white transition"></textarea>
            </div>

            <button type="submit" id="save-btn" class="w-full bg-islamic-800 hover:bg-islamic-900 text-white font-bold py-3.5 rounded-xl shadow-md text-sm transition-all flex items-center justify-center gap-2">
              <i class="fa-solid fa-cloud-arrow-up"></i> সেভ করুন, HTML জেনারেট ও সিঙ্ক করুন
            </button>
          </form>
        </section>

        <!-- List Column -->
        <section class="lg:col-span-7 bg-white rounded-2xl shadow-sm border border-slate-200 flex flex-col h-[calc(100vh-8rem)]">
          <div class="p-5 border-b border-slate-100 flex justify-between items-center bg-slate-50/50 rounded-t-2xl">
            <div>
              <h2 class="text-base font-bold text-slate-800">সকল বইয়ের তালিকা</h2>
              <p class="text-xs text-slate-500 mt-0.5">মোট <span id="list-count" class="font-bold text-emerald-600">০</span> টি বই</p>
            </div>
            <div class="relative w-64">
              <input type="text" id="admin-search" placeholder="বই খুঁজুন..." class="w-full pl-9 pr-3 py-2 border border-slate-300 rounded-lg text-xs outline-none">
              <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-slate-400 text-xs"></i>
            </div>
          </div>
          <div id="admin-books-list" class="flex-1 overflow-y-auto p-3 space-y-2"></div>
        </section>

      </main>
    </div>
  </div>

  <!-- Github Settings Modal -->
  <div id="github-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl p-6 max-w-md w-full shadow-2xl border border-slate-100">
      <div class="flex justify-between items-center border-b border-slate-100 pb-3 mb-4">
        <h3 class="text-lg font-bold text-slate-800"><i class="fa-brands fa-github"></i> গিটহাব API সেটিংস</h3>
        <button id="close-gh-modal" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-xl"></i></button>
      </div>
      <div class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Repository *</label>
          <input type="text" id="gh-repo" placeholder="username/repo" class="w-full border border-slate-300 bg-slate-50 rounded-lg p-2.5 text-sm outline-none">
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">Branch</label>
            <input type="text" id="gh-branch" value="main" class="w-full border border-slate-300 bg-slate-50 rounded-lg p-2.5 text-sm outline-none">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">Data Path</label>
            <input type="text" id="gh-path" value="data.json" class="w-full border border-slate-300 bg-slate-50 rounded-lg p-2.5 text-sm outline-none">
          </div>
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Personal Access Token *</label>
          <input type="password" id="gh-token" placeholder="ghp_..." class="w-full border border-slate-300 bg-slate-50 rounded-lg p-2.5 text-sm outline-none">
        </div>
      </div>
      <div class="mt-6 flex justify-end gap-3">
        <button id="save-gh-settings" class="px-6 py-2.5 bg-emerald-600 text-white rounded-xl text-sm font-bold shadow-md">Save Setup</button>
      </div>
    </div>
  </div>

  <script>
    // Centralized Domain Constant
    const SITE_URL = "https://affiliate-rokomari-islamic.vercel.app";

    let localBooksData = [];
    let fileSha = ""; 

    const notify = (msg, type = 'success') => {
      const color = type === 'error' ? 'bg-red-600' : 'bg-emerald-600';
      const toast = document.createElement('div');
      toast.className = `fixed bottom-4 right-4 ${color} text-white px-4 py-3 rounded-lg shadow-xl text-xs font-bold z-[100]`;
      toast.innerText = msg;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 3500);
    };

    document.getElementById('auth-form').onsubmit = (e) => {
      e.preventDefault();
      if(document.getElementById('admin-pass-input').value === 'admin1234') {
        document.getElementById('auth-screen').style.opacity = '0';
        setTimeout(() => {
          document.getElementById('auth-screen').classList.add('hidden');
          document.getElementById('dashboard').classList.remove('hidden');
          loadDataFromGitOrLocal();
        }, 300);
      } else { notify("❌ ভুল পাসওয়ার্ড!", 'error'); }
    };

    const ghModal = document.getElementById('github-modal');
    document.getElementById('open-github-settings').onclick = () => {
      document.getElementById('gh-repo').value = localStorage.getItem('gh_repo') || '';
      document.getElementById('gh-branch').value = localStorage.getItem('gh_branch') || 'main';
      document.getElementById('gh-path').value = localStorage.getItem('gh_path') || 'data.json';
      document.getElementById('gh-token').value = localStorage.getItem('gh_token') || '';
      ghModal.classList.remove('hidden'); ghModal.classList.add('flex');
    };
    document.getElementById('close-gh-modal').onclick = () => ghModal.classList.add('hidden');

    document.getElementById('save-gh-settings').onclick = () => {
      localStorage.setItem('gh_repo', document.getElementById('gh-repo').value.trim());
      localStorage.setItem('gh_branch', document.getElementById('gh-branch').value.trim() || 'main');
      localStorage.setItem('gh_path', document.getElementById('gh-path').value.trim() || 'data.json');
      localStorage.setItem('gh_token', document.getElementById('gh-token').value.trim());
      notify("✅ গিটহাব কনফিগারেশন সেভ হয়েছে!");
      ghModal.classList.add('hidden');
      loadDataFromGitOrLocal();
    };

    const getGitConfig = () => ({
      repo: localStorage.getItem('gh_repo'), token: localStorage.getItem('gh_token'),
      branch: localStorage.getItem('gh_branch') || 'main', path: localStorage.getItem('gh_path') || 'data.json'
    });
    const utf8ToBase64 = (str) => btoa(unescape(encodeURIComponent(str)));
    const base64ToUtf8 = (str) => decodeURIComponent(escape(atob(str)));

    // Auto HTML filename generator from title
    const sanitizeHtmlFilename = (raw) => {
      let name = raw.trim().toLowerCase().replace(/[^a-z0-9]/g, '-').replace(/-+/g, '-').replace(/^-|-$/g, '');
      if(!name) name = 'book-' + Date.now();
      return name + '.html';
    };

    document.getElementById('book-title').addEventListener('input', (e) => {
      if(!document.getElementById('edit-book-id').value) {
        document.getElementById('book-html-file').value = sanitizeHtmlFilename(e.target.value);
      }
    });

    async function loadDataFromGitOrLocal() {
      const { repo, token, path } = getGitConfig();
      const listContainer = document.getElementById('admin-books-list');

      if (!repo || !token) {
        try {
          const res = await fetch(path + '?v=' + Date.now());
          localBooksData = await res.json(); renderAdminList(localBooksData);
        } catch(e) { listContainer.innerHTML = `<p class="text-xs text-amber-600 p-4">গিটহাব সেটিংস ইনপুট দিন!</p>`; }
        return;
      }

      try {
        const res = await fetch(`https://api.github.com/repos/${repo}/contents/${path}?ref=${getGitConfig().branch}`, { headers: { 'Authorization': `token ${token}` }, cache: 'no-store' });
        if (!res.ok) { localBooksData = []; fileSha = ""; renderAdminList(localBooksData); return; }
        const data = await res.json();
        fileSha = data.sha;
        localBooksData = JSON.parse(base64ToUtf8(data.content));
        if(!Array.isArray(localBooksData)) localBooksData = localBooksData.books || [];
        document.getElementById('sync-status').classList.remove('hidden');
        renderAdminList(localBooksData);
      } catch (err) {
        listContainer.innerHTML = `<p class="text-xs text-red-500 p-4">ডাটা লোড ব্যর্থ!</p>`;
      }
    }

    function renderAdminList(dataArr) {
      const container = document.getElementById('admin-books-list');
      document.getElementById('list-count').innerText = dataArr.length;
      container.innerHTML = '';
      dataArr.forEach(book => {
        const item = document.createElement('div');
        item.className = "flex items-center justify-between bg-white border border-slate-200 rounded-xl p-3";
        const hFile = book.htmlFile || (book.id + '.html');
        item.innerHTML = `
          <div class="flex gap-3 items-center truncate">
            <img src="${book.imageUrl}" class="w-10 h-12 object-cover rounded border">
            <div class="truncate">
              <h4 class="font-bold text-xs truncate">${book.title}</h4>
              <p class="text-[10px] text-emerald-700 font-mono truncate">bookhtml/${hFile}</p>
            </div>
          </div>
          <div class="flex gap-2 shrink-0">
            <a href="${SITE_URL}/bookhtml/${hFile}" target="_blank" class="bg-emerald-50 text-emerald-700 px-2 py-1 rounded text-xs font-bold" title="View Static Page"><i class="fa-solid fa-eye"></i></a>
            <button onclick="editBook('${book.id}')" class="bg-indigo-50 text-indigo-700 px-2.5 py-1 rounded text-xs font-bold">এডিট</button>
            <button onclick="deleteBook('${book.id}')" class="bg-red-50 text-red-600 px-2.5 py-1 rounded text-xs font-bold">ডিলিট</button>
          </div>
        `;
        container.appendChild(item);
      });
    }

    window.editBook = (id) => {
      const book = localBooksData.find(b => b.id === id);
      if (!book) return;
      document.getElementById('edit-book-id').value = book.id;
      document.getElementById('book-title').value = book.title;
      const htmlFileName = book.htmlFile || (book.id + '.html');
      document.getElementById('book-html-file').value = htmlFileName;
      document.getElementById('old-html-file').value = htmlFileName;
      document.getElementById('book-category').value = book.category || '';
      document.getElementById('affiliate-link').value = book.affiliateLink;
      document.getElementById('coupon-code').value = book.couponCode || '';
      document.getElementById('book-featured').checked = !!book.featured;
      document.getElementById('book-desc').value = book.description;
      document.getElementById('image-url-input').value = book.imageUrl || '';
      document.getElementById('form-title').innerText = "বই এডিট করুন";
      document.getElementById('reset-form-btn').classList.remove('hidden');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    document.getElementById('reset-form-btn').onclick = (e) => {
      e.preventDefault();
      document.getElementById('book-form').reset();
      document.getElementById('edit-book-id').value = '';
      document.getElementById('old-html-file').value = '';
      document.getElementById('form-title').innerText = "বই যুক্ত করুন";
      document.getElementById('reset-form-btn').classList.add('hidden');
    };

    // --- UPLOAD TO image/ FOLDER ---
    document.getElementById('btn-direct-upload').onclick = async () => {
      const fileInput = document.getElementById('file-input');
      const customNameInput = document.getElementById('custom-file-name').value.trim();
      const btn = document.getElementById('btn-direct-upload');
      const resBox = document.getElementById('upload-result');
      
      if (!fileInput.files[0] || !customNameInput) { notify("ফাইল এবং ফাইলের নাম দিন।", "error"); return; }
      
      const file = fileInput.files[0];
      const { repo, token, branch } = getGitConfig();
      if (!repo || !token) { notify("গিটহাব কনফিগারেশন নেই!", "error"); return; }

      btn.disabled = true;
      try {
        const base64Data = await new Promise((resolve) => {
          const reader = new FileReader();
          reader.readAsDataURL(file);
          reader.onload = () => resolve(reader.result.split(',')[1]);
        });

        const exactPath = `image/${customNameInput}`;
        const finalUrl = `${SITE_URL}/${exactPath}`;

        let fileShaForImage = null;
        try {
          const checkRes = await fetch(`https://api.github.com/repos/${repo}/contents/${exactPath}?ref=${branch}`, { headers: { 'Authorization': `token ${token}` } });
          if(checkRes.ok) fileShaForImage = (await checkRes.json()).sha;
        } catch(e) {}

        const payload = { message: `Upload ${exactPath}`, content: base64Data, branch: branch };
        if(fileShaForImage) payload.sha = fileShaForImage;

        const res = await fetch(`https://api.github.com/repos/${repo}/contents/${exactPath}`, {
          method: 'PUT',
          headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (!res.ok) throw new Error("গিটহাবে আপলোড ব্যর্থ হয়েছে।");

        resBox.classList.remove('hidden');
        document.getElementById('uploaded-url-text').href = finalUrl;
        document.getElementById('uploaded-url-text').innerText = finalUrl;
        document.getElementById('image-url-input').value = finalUrl;
        notify("✅ সফলভাবে image/ ফোল্ডারে আপলোড হয়েছে!");
      } catch (err) {
        notify("❌ Error: " + err.message, "error");
      } finally {
        btn.disabled = false;
        fileInput.value = "";
      }
    };

    // --- GENERATE STATIC HTML TEMPLATE FOR BOOK ---
    function generateBookHtmlContent(book) {
      const cleanDesc = book.description ? book.description.replace(/[\*\_~`#-]/g, '').trim().substring(0, 160) : 'ইসলামিক বইয়ের বিস্তারিত বিবরণ ও বিশেষ অফার।';
      const pageTitle = `${book.title} | Rokomari Islamic`;
      const htmlFile = book.htmlFile || (book.id + '.html');
      const canonicalUrl = `${SITE_URL}/bookhtml/${htmlFile}`;
      const imgUrl = book.imageUrl || 'https://onlinecdndrive.vercel.app/rokomari-islamic-logo.jpg';

      return `<!DOCTYPE html>
<html lang="bn" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <meta name="description" content="${cleanDesc}">
  <link rel="canonical" href="${canonicalUrl}">
  <link rel="icon" type="image/jpeg" href="https://onlinecdndrive.vercel.app/rokomari-islamic-logo.jpg">

  <!-- Open Graph Meta Tags for Facebook, WhatsApp & Social Sharing -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Rokomari Islamic">
  <meta property="og:title" content="${book.title}">
  <meta property="og:description" content="${cleanDesc}">
  <meta property="og:image" content="${imgUrl}">
  <meta property="og:image:alt" content="${book.title}">
  <meta property="og:url" content="${canonicalUrl}">

  <!-- Twitter Meta Tags -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="${book.title}">
  <meta name="twitter:description" content="${cleanDesc}">
  <meta name="twitter:image" content="${imgUrl}">

  <script src="https://cdn.tailwindcss.com"><\/script>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"><\/script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.3/purify.min.js"><\/script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Hind Siliguri', 'sans-serif'] },
          colors: { islamic: { 800: '#166534', 900: '#14532d' } }
        }
      }
    }
  <\/script>
  <style>
    body { font-family: 'Hind Siliguri', sans-serif; }
    .prose-custom p { margin-bottom: 0.85rem; line-height: 1.7; }
    .prose-custom strong { font-weight: 700; color: inherit; }
    .prose-custom ul { list-style-type: disc; padding-left: 1.5rem; margin-bottom: 0.85rem; }
    .prose-custom a { color: #059669; text-decoration: underline; font-weight: 600; word-break: break-all; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-900 dark:text-slate-200 min-h-screen flex flex-col justify-between">

  <header class="bg-white dark:bg-slate-900 shadow-sm sticky top-0 z-40 border-b border-slate-200 dark:border-slate-800">
    <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="../index.html" class="flex items-center gap-2 text-xs font-bold text-slate-700 dark:text-slate-300 hover:text-emerald-600 transition">
        <i class="fa-solid fa-arrow-left"></i> সকল বইয়ে ফিরে যান
      </a>
      <a href="../index.html" class="flex items-center gap-2">
        <span class="text-sm font-bold text-islamic-900 dark:text-emerald-400">Rokomari Islamic</span>
      </a>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 py-8 flex-1 w-full">
    <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 overflow-hidden flex flex-col md:flex-row">
      
      <div class="w-full md:w-2/5 h-72 md:h-[450px] bg-slate-100 dark:bg-slate-900 flex items-center justify-center p-6 relative border-b md:border-b-0 md:border-r border-slate-200 dark:border-slate-700">
        <img src="${imgUrl}" alt="${book.title}" loading="eager" class="max-w-full max-h-full object-contain drop-shadow-xl rounded">
        <button id="detail-wishlist-btn" class="absolute bottom-4 left-4 w-10 h-10 bg-white dark:bg-slate-700 rounded-full shadow-lg flex items-center justify-center text-slate-400 hover:text-red-500 transition text-lg border border-slate-200 dark:border-slate-600">
          <i class="fa-solid fa-heart"></i>
        </button>
      </div>

      <div class="w-full md:w-3/5 p-6 md:p-8 flex flex-col justify-between">
        <div>
          <span class="text-xs font-bold text-emerald-600 dark:text-emerald-400 uppercase tracking-wider mb-2 block">${book.category || 'ইসলামিক বই'}</span>
          <h1 class="text-2xl md:text-3xl font-bold text-slate-900 dark:text-white mb-4 leading-snug">${book.title}</h1>
          
          ${book.couponCode ? `
          <div class="mb-6 bg-amber-50 dark:bg-amber-900/20 border border-amber-200 dark:border-amber-700/50 rounded-xl p-3 flex items-center justify-between shadow-sm">
            <span class="text-amber-800 dark:text-amber-400 font-bold text-xs"><i class="fa-solid fa-ticket mr-1"></i> কুপন কোড:</span>
            <div class="flex items-center gap-2">

              <button id="copy-coupon-btn" class="bg-amber-500 hover:bg-amber-600 text-white w-7 h-7 rounded flex items-center justify-center transition text-xs"><i class="fa-regular fa-copy"></i></button>
            </div>
          </div>` : ''}

          <div id="detail-desc" class="prose-custom text-slate-600 dark:text-slate-300 text-sm mb-6"></div>
        </div>

        <div class="space-y-3 pt-4 border-t border-slate-100 dark:border-slate-700">
          <a href="${book.affiliateLink || '#'}" target="_blank" rel="noopener noreferrer" class="w-full bg-islamic-800 hover:bg-islamic-900 text-white font-bold py-3.5 px-4 rounded-xl text-sm shadow-lg hover:shadow-xl transition-all flex items-center justify-center gap-2">
            <i class="fa-solid fa-cart-shopping text-amber-400"></i> এখনই অর্ডার করুন (Buy Now)
          </a>
          <button id="detail-share-btn" class="w-full bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 text-slate-700 dark:text-slate-200 font-bold py-3 px-4 rounded-xl text-xs transition flex items-center justify-center gap-2">
            <i class="fa-solid fa-arrow-up-from-bracket"></i> শেয়ার করুন (Share)
          </button>
        </div>

    </div>
  </main>

  <footer class="bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 text-center py-6 mt-auto">
    <p class="text-xs font-bold text-slate-500">© 2026 Rokomari Islamic. All Rights Reserved.</p>
  </footer>

  <div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 bg-slate-800 text-white px-5 py-2.5 rounded-full shadow-2xl z-[100] text-xs font-bold flex items-center gap-2 transition-all transform translate-y-10 opacity-0 pointer-events-none">
    <i class="fa-solid fa-circle-check text-emerald-400 text-sm"></i>
    <span id="toast-msg">Success</span>
  </div>

  <script>
    const rawMarkdown = ${JSON.stringify(book.description || '')};
    const showToast = (msg) => {
      const toast = document.getElementById('toast');
      document.getElementById('toast-msg').innerText = msg;
      toast.classList.remove('translate-y-10', 'opacity-0');
      setTimeout(() => toast.classList.add('translate-y-10', 'opacity-0'), 2500);
    };

    const renderer = new marked.Renderer();
    renderer.link = function(href, title, text) {
      return \`<a href="\${href}" target="_blank" rel="noopener noreferrer" class="text-emerald-600 dark:text-emerald-400 font-bold underline hover:text-emerald-700">\${text}</a>\`;
    };
    marked.setOptions({ renderer: renderer, breaks: true, gfm: true });
    document.getElementById('detail-desc').innerHTML = DOMPurify.sanitize(marked.parse(rawMarkdown));

    const copyBtn = document.getElementById('copy-coupon-btn');
    if(copyBtn) {
      copyBtn.onclick = () => {
        navigator.clipboard.writeText('${book.couponCode}');
        showToast("কুপন কোড কপি হয়েছে!");
      };
    }

    document.getElementById('detail-share-btn').onclick = () => {
      const shareUrl = '${canonicalUrl}';
      if (navigator.share) {
        navigator.share({ title: '${book.title}', text: 'এই ইসলামিক বইটি চেক করুন!', url: shareUrl }).catch(e=>console.log(e));
      } else {
        navigator.clipboard.writeText(shareUrl);
        showToast("লিংক কপি হয়েছে!");
      }
    };
  <\/script>

    }

    // --- UPLOAD BOOK HTML FILE TO GITHUB ---
    async function uploadBookHtmlFile(bookObj, oldHtmlFile) {
      const { repo, token, branch } = getGitConfig();
      if(!repo || !token) throw new Error("GitHub Configuration Missing");

      const htmlFileName = bookObj.htmlFile;
      const htmlContent = generateBookHtmlContent(bookObj);
      const base64Content = utf8ToBase64(htmlContent);
      const gitPath = `bookhtml/${htmlFileName}`;

      // Check existing SHA
      let fileShaForHtml = null;
      try {
        const checkRes = await fetch(`https://api.github.com/repos/${repo}/contents/${gitPath}?ref=${branch}`, {
          headers: { 'Authorization': `token ${token}` }
        });
        if(checkRes.ok) {
          const fileData = await checkRes.json();
          fileShaForHtml = fileData.sha;
        }
      } catch(e) {}

      const payload = {
        message: `Generate static page ${gitPath}`,
        content: base64Content,
        branch: branch
      };
      if(fileShaForHtml) payload.sha = fileShaForHtml;

      const res = await fetch(`https://api.github.com/repos/${repo}/contents/${gitPath}`, {
        method: 'PUT',
        headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      if(!res.ok) throw new Error("Static Book HTML Generation Failed");

      // Delete old HTML file if filename was changed
      if(oldHtmlFile && oldHtmlFile !== htmlFileName) {
        try {
          const oldGitPath = `bookhtml/${oldHtmlFile}`;
          const oldCheck = await fetch(`https://api.github.com/repos/${repo}/contents/${oldGitPath}?ref=${branch}`, {
            headers: { 'Authorization': `token ${token}` }
          });
          if(oldCheck.ok) {
            const oldData = await oldCheck.json();
            await fetch(`https://api.github.com/repos/${repo}/contents/${oldGitPath}`, {
              method: 'DELETE',
              headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
              body: JSON.stringify({
                message: `Remove old static page ${oldGitPath}`,
                sha: oldData.sha,
                branch: branch
              })
            });
          }
        } catch(err) { console.error("Could not delete old file:", err); }
      }
    }

    // --- SAVE BOOK & SYNC ALL ---
    document.getElementById('book-form').onsubmit = async (e) => {
      e.preventDefault();
      const saveBtn = document.getElementById('save-btn');
      const originalBtnHtml = saveBtn.innerHTML;

      let htmlFileName = document.getElementById('book-html-file').value.trim();
      if(!htmlFileName.endsWith('.html')) htmlFileName += '.html';
      
      if(htmlFileName.includes('/') || htmlFileName.includes('\\')) {
        notify("HTML ফাইলের নামে / বা \\ থাকা যাবে না!", "error"); return;
      }

      const editId = document.getElementById('edit-book-id').value;
      const oldHtmlFile = document.getElementById('old-html-file').value;

      // Check uniqueness of htmlFile
      const duplicate = localBooksData.find(b => b.htmlFile === htmlFileName && b.id !== editId);
      if(duplicate) {
        notify("এই HTML ফাইল নেমটি অন্য একটি বইয়ে ব্যবহার করা হয়েছে!", "error"); return;
      }

      saveBtn.disabled = true;
      saveBtn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i> প্রসেস ও HTML সেভ হচ্ছে...`;

      try {
        const bookObj = {
          id: editId || 'book_' + Date.now(),
          title: document.getElementById('book-title').value.trim(),
          htmlFile: htmlFileName,
          category: document.getElementById('book-category').value.trim(),
          affiliateLink: document.getElementById('affiliate-link').value.trim(),
          couponCode: document.getElementById('coupon-code').value.trim(),
          imageUrl: document.getElementById('image-url-input').value.trim(),
          description: document.getElementById('book-desc').value.trim(),
          featured: document.getElementById('book-featured').checked,
          createdAt: editId ? (localBooksData.find(b=>b.id===editId)?.createdAt || Date.now()) : Date.now()
        };

        // STEP 1: Upload Static HTML Page to GitHub
        await uploadBookHtmlFile(bookObj, oldHtmlFile);

        // STEP 2: Update local JSON array
        if (editId) {
          const idx = localBooksData.findIndex(b => b.id === editId);
          if (idx !== -1) localBooksData[idx] = { ...localBooksData[idx], ...bookObj };
        } else {
          localBooksData.unshift(bookObj);
        }

        // STEP 3: Sync data.json
        await syncDataToGithub();

        document.getElementById('reset-form-btn').click();
        notify("🎉 সফলভাবে বই, ছবি ও Book HTML সেভ হয়েছে!");
      } catch (err) {
        notify("❌ Error: " + err.message, "error");
      } finally {
        saveBtn.disabled = false;
        saveBtn.innerHTML = originalBtnHtml;
      }
    };

    async function syncDataToGithub() {
      const { repo, token, branch, path } = getGitConfig();
      if (!repo || !token) throw new Error("গিটহাব কনফিগারেশন নেই।");

      const contentString = utf8ToBase64(JSON.stringify(localBooksData, null, 2));
      const payload = { message: "Update data.json via CMS", content: contentString, branch: branch };
      if (fileSha) payload.sha = fileSha;

      const res = await fetch(`https://api.github.com/repos/${repo}/contents/${path}`, {
        method: 'PUT',
        headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      if (!res.ok) throw new Error("গিটহাব API আপডেট ব্যর্থ হয়েছে।");
      const resData = await res.json();
      fileSha = resData.content.sha;
      renderAdminList(localBooksData);
    }

    window.deleteBook = async (id) => {
      const book = localBooksData.find(b => b.id === id);
      if (!book) return;

      if (confirm(`আপনি কি নিশ্চিত "${book.title}" বইটি ও এর HTML পেজটি মুছে ফেলতে চান?`)) {
        const { repo, token, branch } = getGitConfig();
        const htmlFileName = book.htmlFile || (book.id + '.html');
        
        localBooksData = localBooksData.filter(b => b.id !== id);
        renderAdminList(localBooksData);

        try {
          // Delete HTML file from GitHub
          if(repo && token) {
            const gitPath = `bookhtml/${htmlFileName}`;
            const checkRes = await fetch(`https://api.github.com/repos/${repo}/contents/${gitPath}?ref=${branch}`, {
              headers: { 'Authorization': `token ${token}` }
            });
            if(checkRes.ok) {
              const fileData = await checkRes.json();
              await fetch(`https://api.github.com/repos/${repo}/contents/${gitPath}`, {
                method: 'DELETE',
                headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: `Delete static page ${gitPath}`, sha: fileData.sha, branch: branch })
              });
            }
          }
          await syncDataToGithub();
          notify("🗑️ বইটি ও তার HTML ফাইল সফলভাবে মুছে ফেলা হয়েছে।");
        } catch (e) {
          notify("❌ ডিলিট ব্যর্থ: " + e.message, 'error');
          loadDataFromGitOrLocal();
        }
      }
    };

    window.downloadJSONBackup = () => {
      const blob = new Blob([JSON.stringify(localBooksData, null, 2)], { type: 'application/json' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
      a.download = `data-backup.json`; a.click();
    };
  </script>
